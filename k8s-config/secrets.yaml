apiVersion: v1
kind: Secret
metadata:
  name: auth-secrets
type: Opaque
stringData:
  JWT_SECRET: "your_strong_jwt_secret_key_here"

---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secrets
type: Opaque
stringData:
  POSTGRES_PASSWORD: "your_postgres_password"
  POSTGRES_USER: "postgres"
  POSTGRES_DB: "task_bot"